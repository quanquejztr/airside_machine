<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airside Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Limelight&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <svg class="lg-svg" aria-hidden="true" focusable="false">
    <filter id="lg-dist" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="70" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="lg-dist-bar" x="-30%" y="-80%" width="160%" height="260%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="92" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="1.4" result="blurred" />
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="28" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div id="map"></div>

  <header id="hud" class="glass-panel lift">
    <div class="glass-filter"></div>
    <div class="glass-overlay"></div>
    <div class="glass-specular"></div>
    <div class="glass-content hud-inner">
      <div class="hud-brand">Airside Machine</div>
      <div id="hud-airline" class="hud-meta">No airline</div>
      <div id="hud-time" class="hud-meta">—</div>
      <div id="hud-cash" class="hud-cash">
        <span id="hud-cash-amt">—</span>
        <div id="hud-cash-tip" class="hud-tip">
          <div class="hud-tip-row"><span>Week revenue</span><b id="hud-rev">—</b></div>
          <div class="hud-tip-row"><span>Ops cash flow</span><b id="hud-cf">—</b></div>
          <div class="hud-tip-row"><span>Fuel spot</span><b id="hud-fuel">—</b></div>
          <div class="hud-tip-row"><span>Debt</span><b id="hud-debt">—</b></div>
          <div class="hud-tip-row"><span>Weekly loan</span><b id="hud-loan">—</b></div>
          <div class="hud-tip-row"><span id="hud-today-lbl">Today revenue</span><b id="hud-today">—</b></div>
        </div>
      </div>
      <div class="hud-speeds" id="hud-speeds">
        <button type="button" data-speed="0">Pause</button>
        <button type="button" data-speed="1">1×</button>
        <button type="button" data-speed="2">2×</button>
        <button type="button" data-speed="4">4×</button>
        <button type="button" data-speed="20">20×</button>
        <button type="button" data-speed="60">60×</button>
      </div>
    </div>
  </header>

  <div id="windows"></div>

  <footer id="dock" class="glass-panel lift">
    <div class="glass-filter"></div>
    <div class="glass-overlay"></div>
    <div class="glass-specular"></div>
    <div class="glass-content dock-inner">
      <button type="button" data-win="airline">Airline</button>
      <button type="button" data-win="catalog">Buy aircraft</button>
      <button type="button" data-win="fleet">Fleet</button>
      <button type="button" data-win="board" class="dock-primary">Airport board</button>
      <button type="button" data-win="routes">Open route</button>
      <button type="button" data-win="routedetail">Route detail</button>
      <button type="button" data-win="schedule">Schedule</button>
      <button type="button" data-win="tailgrid">Aircraft schedule</button>
      <button type="button" data-win="gates">Gate auctions</button>
      <button type="button" data-win="bids">My bids</button>
      <button type="button" data-win="slots">Slots</button>
      <button type="button" data-win="bank">Bank</button>
      <button type="button" data-win="books">Books</button>
      <button type="button" data-win="competitors">Competitors</button>
    </div>
  </footer>

  <div id="ticker" class="glass-panel">
    <div class="glass-filter"></div>
    <div class="glass-overlay"></div>
    <div class="glass-specular"></div>
    <div class="glass-content ticker-inner">
      <span id="ticker-text">News: —</span>
    </div>
  </div>
  <div id="toast" class="glass-panel" hidden>
    <div class="glass-filter"></div>
    <div class="glass-overlay"></div>
    <div class="glass-specular"></div>
    <div class="glass-content toast-inner"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.geodesic@2.7.2/dist/leaflet.geodesic.umd.min.js"
    integrity="sha512-xpefEm742/sELYn8wdYCejRseXu24rGp5BxGShPo1lN+UxwPPIYNiskHW8GIJvFAicvqpzH62fltgly0eaAbOA=="
    crossorigin="anonymous"></script>
  <script src="/app.js?v=13"></script>
</body>
</html>
